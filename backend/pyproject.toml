[project]
name = "backend"
version = "0.1.0"
description = "AI Venture Lab backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "alembic>=1.20,<2.0",
    "asyncpg>=0.31,<1.0",
    "fastapi>=0.141,<1.0",
    "langgraph>=1.0,<2.0",
    "openai>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.15,<3.0",
    "pydantic[email]>=2.13,<3.0",
    "redis>=8.1,<9.0",
    "sqlalchemy>=2.0,<3.0",
    "tavily-python>=0.7,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
