name: Backend CI


on:

  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main



jobs:


  test:

    name: Backend tests

    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: backend



    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true



      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"



      - name: Install dependencies
        run: |
          uv sync



      - name: Run tests
        run: |
          uv run pytest