name: Frontend CI


on:

  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main




jobs:


  build:


    name: Frontend build


    runs-on: ubuntu-latest


    defaults:

      run:

        working-directory: frontend




    steps:


      - name: Checkout repository

        uses: actions/checkout@v4





      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: "22"

          cache: "npm"

          cache-dependency-path: frontend/package-lock.json





      - name: Install dependencies

        run: |

          npm ci





      - name: Run lint

        run: |

          npm run lint





      - name: Build application

        run: |

          npm run build